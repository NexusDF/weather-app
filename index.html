<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="%BASE_URL%favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%favicon-32.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Прогноз погоды: температура, ветер и осадки" />
    <meta name="theme-color" content="#102033" />
    <script>
      ;(() => {
        const hour = new Date().getHours()
        const day = hour >= 7 && hour < 19
        const meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.setAttribute('content', day ? '#1c6eae' : '#0b1026')
      })()
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Погода" />
    <title>Погода</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
